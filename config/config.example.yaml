aria:
  host: "0.0.0.0"
  port: 8800
  log_level: "info"
  public_url: ""

llm:
  model: "ollama_chat/qwen3:8b"
  api_base: "http://localhost:11434"
  api_key: ""
  temperature: 0.4
  max_tokens: 4096
  timeout_seconds: 60

web_llm:
  enabled: false
  profile: ""
  model: ""
  api_base: null
  api_key: ""
  transport: "openai_responses"
  temperature: 0.4
  max_tokens: 4096
  timeout_seconds: 60
  search_context_size: "low"
  max_search_uses: 3
  max_output_tokens: 1200
  allowed_domains: []
  required_url_prefixes: []
  capability_verified_at: ""

web_evidence:
  enabled: true
  collection: "aria_web_evidence"
  read_timeout_ms: 200
  ttl_hours: 24

embeddings:
  model: "ollama/nomic-embed-text"
  api_base: "http://localhost:11434"
  api_key: ""
  timeout_seconds: 60

profiles:
  active:
    llm: "default"
    main_llm: "default"
    web_llm: ""
    embeddings: "default"
  llm:
    default:
      model: "ollama_chat/qwen3:8b"
      api_base: "http://localhost:11434"
      api_key: ""
      temperature: 0.4
      max_tokens: 4096
      timeout_seconds: 60
  embeddings:
    default:
      model: "ollama/nomic-embed-text"
      api_base: "http://localhost:11434"
      api_key: ""
      timeout_seconds: 60

memory:
  enabled: true
  backend: "qdrant"
  qdrant_url: "http://localhost:6333"
  qdrant_api_key: ""
  collection: "aria_memory"
  top_k: 3
  compression_summary_prompt: "prompts/recipes/memory_compress.md"
  collections:
    facts:
      prefix: "aria_facts"
      weight: 1.0
      top_k: 2
      dedup_threshold: 0.85
    preferences:
      prefix: "aria_preferences"
      weight: 0.8
      top_k: 1
      dedup_threshold: 0.80
    sessions:
      prefix: "aria_sessions"
      weight: 0.5
      top_k: 2
      time_decay: true
      compress_after_days: 7
      archive_after_days: 90
    knowledge:
      prefix: "aria_knowledge"
      weight: 0.7
      top_k: 2
      dedup_threshold: 0.90

inventory_index:
  enabled: true
  cron: "17 */6 * * *"
  timezone: "Europe/Zurich"
  run_on_startup: false
  keep_backup: true
  score_threshold: 0.35
  candidate_limit: 12

routing:
  qdrant_connection_routing_enabled: false
  qdrant_score_threshold: 0.72
  qdrant_candidate_limit: 5
  qdrant_ask_on_low_confidence: true
  meta_catalog_strict_contract_enabled: false

agentic_loop:
  # MCP is an explicit external read boundary and remains opt-in.
  native_agent_mcp_enabled: false
  # Attach bounded MCP image results only to vision-capable native-agent turns.
  native_agent_mcp_vision_enabled: true
  native_agent_mcp_vision_max_live_images: 4
  native_agent_mcp_vision_max_lifetime_images: 24
  # Large catalogs keep all Core Tools plus this many semantically selected MCP Tools.
  native_tool_selector_top_k: 16
  # Native agent loop headroom; provider retries consume this bounded call budget.
  native_agent_max_steps: 32
  native_agent_max_provider_calls: 32
  # Long native-agent turns detach before the browser's 90-second request limit.
  async_agent_job_sync_budget_seconds: 25
  native_agent_budget_extension_steps: 32
  native_agent_budget_max_total: 160
  agent_job_retention_days: 14
  agent_job_stale_paused_days: 7

prompts:
  persona: "prompts/persona.md"
  skills_dir: "prompts/recipes/"

channels:
  api:
    enabled: true
    auth_token: ""

connections:
  ssh: {}
  discord: {}
  sftp: {}
  smb: {}
  webhook: {}
  # Machine-to-machine event ingress. Authentication tokens belong in Secure Store.
  inbound_webhook: {}
  smtp: {}
  imap: {}
  http_api: {}
  rss: {}
  mqtt: {}

# Optional generic Model Context Protocol clients. Server enablement and the
# native_agent_mcp_enabled flag must both be true before ARIA connects.
mcp_servers: {}

rss:
  poll_interval_minutes: 60

token_tracking:
  enabled: true
  log_file: "data/logs/tokens.jsonl"
  retention_days: 30

pricing:
  enabled: true
  currency: "USD"
  last_updated: "2026-03-17"
  default_source_name: "LiteLLM GitHub pricing JSON"
  default_source_url: "https://github.com/BerriAI/litellm/blob/main/model_prices_and_context_window.json"
  source: "litellm_github"
  litellm_cache_file: "data/pricing/litellm_model_prices.json"
  refresh_interval_days: 7
  model_aliases:
    embed-small: "openai/text-embedding-3-small"
    openai/embed-small: "openai/text-embedding-3-small"
  chat_models: {}
  embedding_models: {}

ui:
  title: "ARIA"
  debug_mode: false
  language: "de"
  theme: "matrix"
  background: "grid"

security:
  enabled: true
  db_path: "data/auth/aria_secure.sqlite"
  bootstrap_locked: false
  guardrails: {}

skills:
  custom: {}
