name: aria-demo

services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    networks: [demo]
    ports:
      - "127.0.0.1:${ARIA_DEMO_QDRANT_PORT:-8091}:6333"
    volumes:
      - aria-demo-qdrant:/qdrant/storage

  seed:
    image: ${ARIA_DEMO_IMAGE:?Set ARIA_DEMO_IMAGE}
    profiles: [seed]
    entrypoint: ["sh", "-c"]
    command: ["cp -a /seed/. /app/data/ && chmod -R u+rwX,go-rwx /app/data"]
    volumes:
      - ./generated/data:/seed:ro
      - aria-demo-data:/app/data

  llm-stub:
    image: ${ARIA_DEMO_IMAGE:?Set ARIA_DEMO_IMAGE}
    restart: unless-stopped
    networks: [demo]
    entrypoint: ["python", "/stub/llm_stub.py", "--port", "8099"]
    volumes:
      - ../scripts/demo/llm_stub.py:/stub/llm_stub.py:ro

  aria:
    image: ${ARIA_DEMO_IMAGE:?Set ARIA_DEMO_IMAGE}
    restart: unless-stopped
    depends_on: [qdrant, llm-stub]
    networks: [demo]
    ports:
      - "${ARIA_DEMO_PORT:-8090}:8800"
    environment:
      ARIA_ARIA_HOST: 0.0.0.0
      ARIA_ARIA_PORT: 8800
      TZ: Europe/Zurich
      ARIA_MASTER_KEY: ${ARIA_DEMO_MASTER_KEY:?Generated by reset.sh}
      # No outbound internet: update checks keep the prepared demo state and
      # nothing leaves the demo. Only the demo-internal services are reachable.
      HTTP_PROXY: http://127.0.0.1:9
      HTTPS_PROXY: http://127.0.0.1:9
      http_proxy: http://127.0.0.1:9
      https_proxy: http://127.0.0.1:9
      NO_PROXY: qdrant,llm-stub,localhost,127.0.0.1
      no_proxy: qdrant,llm-stub,localhost,127.0.0.1
    volumes:
      - ./generated/config:/app/config:rw
      - aria-demo-data:/app/data
      - aria-demo-qdrant:/qdrant/storage:ro

networks:
  demo:
    name: aria-demo-net

volumes:
  aria-demo-data:
    name: aria-demo-data
  aria-demo-qdrant:
    name: aria-demo-qdrant
